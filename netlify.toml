# Netlify deployment configuration (alternative to Vercel)
# Build command installs web deps and builds the production bundle
[build]
  command = "npm --prefix apps/web install && npm --prefix apps/web run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://scip-api.onrender.com/api"

# SPA fallback — serve index.html for all non-asset routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
